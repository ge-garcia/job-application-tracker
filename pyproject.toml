[project]
name = "jot"
version = "0.1.0"
description = "FIU COP-4751 Final Project"
requires-python = ">=3.12"
authors = [{ name = "Gabriel Garcia", email = "mail@gabrielgarcia.gg" }]
dependencies = [
  "annotated-types==0.7.0",
  "blinker==1.9.0",
  "click==8.1.8",
  "dnspython==2.9.2",
  "email-validator==2.3.0",
  "flask==3.1.3",
  "idna==3.20",
  "importlib-metadata==8.7.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "markupsafe==3.0.4",
  "mysql-connector-python==9.4.0",
  "pydantic==2.13.5",
  "pydantic-core==2.46.5",
  "python-dotenv==1.2.4",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.2",
  "werkzeug==3.1.9",
  "zipp==3.23.1",
]

[project.scripts]
jot = "jot:main"

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.2.0",
  "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
